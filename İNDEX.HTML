function findRecipes() {

    const input = document
        .getElementById("ingredients")
        .value
        .toLowerCase();

    const userIngredients = input
        .split(",")
        .map(item => item.trim())
        .filter(item => item !== "");

    const results = document.getElementById("results");

    if (userIngredients.length === 0) {
        results.innerHTML =
            "<p>Please enter at least one ingredient.</p>";
        return;
    }

    let matches = [];

    recipes.forEach(recipe => {

        const matchedIngredients = recipe.ingredients.filter(
            ingredient => userIngredients.includes(ingredient)
        );

        const missingIngredients = recipe.ingredients.filter(
            ingredient => !userIngredients.includes(ingredient)
        );

        const percentage =
            Math.round(
                (matchedIngredients.length /
                recipe.ingredients.length) * 100
            );

        if (matchedIngredients.length > 0) {

            matches.push({
                recipe: recipe,
                matched: matchedIngredients,
                missing: missingIngredients,
                percentage: percentage
            });

        }

    });


    matches.sort((a, b) => b.percentage - a.percentage);


    if (matches.length === 0) {

        results.innerHTML =
            "<h2>No recipes found.</h2>" +
            "<p>Try adding different ingredients.</p>";

        return;
    }


    let html = "<h2>Suggested Recipes</h2>";


    matches.forEach(item => {

        html += `
            <div class="recipe">

                <h3>${item.recipe.name}</h3>

                <p>
                    <span class="match">
                        ${item.percentage}% ingredients available
                    </span>
                </p>

                <p>
                    <strong>Ingredients:</strong>
                    ${item.recipe.ingredients.join(", ")}
                </p>

                <p class="match">
                    You have:
                    ${item.matched.join(", ")}
                </p>

                <p class="missing">
                    Missing:
                    ${
                        item.missing.length > 0
                        ? item.missing.join(", ")
                        : "None - You have all ingredients!"
                    }
                </p>

            </div>
        `;

    });


    results.innerHTML = html;

}
